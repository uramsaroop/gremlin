apiVersion: apps/v1
kind: Deployment
metadata:
  name: gremlin
  namespace: gremlin
  labels:
    app: gremlin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gremlin
  template:
    metadata:
      labels:
        app: gremlin
    spec:
      containers:
        - name: gremlin
          image: ghcr.io/uramsaroop/gremlin:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
