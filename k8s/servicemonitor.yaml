# Requires the kube-prometheus-stack CRDs to already be installed.
# NOTE: by default, kube-prometheus-stack's Prometheus only picks up
# ServiceMonitors labeled with `release: <helm-release-name>` (e.g. "kube-prometheus-stack").
# Check your HelmRelease values — if serviceMonitorSelectorNilUsesHelmValues is true (default),
# add that label below, e.g.:
#   labels:
#     release: kube-prometheus-stack
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gremlin
  namespace: gremlin
  labels:
    app: gremlin
spec:
  selector:
    matchLabels:
      app: gremlin
  namespaceSelector:
    matchNames:
      - gremlin
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
